<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保育士カレンダー</title>
    <script>
        function redirect() {
            const ua = navigator.userAgent.toLowerCase();
            const isIOS = /iphone|ipad|ipod/.test(ua);
            const isAndroid = /android/.test(ua);

            if (isIOS) {
                window.location.href = 'https://apps.apple.com/jp/app/%E4%BF%9D%E8%82%B2%E5%A3%AB%E3%82%AB%E3%83%AC%E3%83%B3%E3%83%80%E3%83%BC-30%E7%A7%92%E3%81%A7%E3%82%B7%E3%83%95%E3%83%88%E7%99%BB%E9%8C%B2%E3%81%8C%E3%81%A7%E3%81%8D%E3%82%8B/id6741706024';
            } else if (isAndroid) {
                window.location.href = 'https://play.google.com/store/apps/details?id=jp.summervacation.shifthoiku2&hl=ja';
            } else {
                window.location.href = 'https://apps.apple.com/jp/app/%E4%BF%9D%E8%82%B2%E5%A3%AB%E3%82%AB%E3%83%AC%E3%83%B3%E3%83%80%E3%83%BC-30%E7%A7%92%E3%81%A7%E3%82%B7%E3%83%95%E3%83%88%E7%99%BB%E9%8C%B2%E3%81%8C%E3%81%A7%E3%81%8D%E3%82%8B/id6741706024';
            }
        }
        window.addEventListener('load', redirect);
    </script>
</head>
<body>
    <p>アプリストアへ移動しています...</p>
</body>
</html>
